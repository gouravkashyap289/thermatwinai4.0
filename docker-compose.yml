services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: thermatwin
      POSTGRES_USER: thermatwin
      POSTGRES_PASSWORD: thermatwin
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://thermatwin:thermatwin@database:5432/thermatwin
    ports: ["8000:8000"]
    depends_on: [database]

  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports: ["3000:3000"]
    depends_on: [backend]

volumes:
  pgdata:

